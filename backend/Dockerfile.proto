# Dockerfile for generating protobuf files
FROM golang:1.21-alpine

# Install protoc and dependencies
RUN apk add --no-cache protobuf protobuf-dev

# Install Go protobuf plugins
RUN go install google.golang.org/protobuf/cmd/protoc-gen-go@latest && \
    go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

# Set working directory
WORKDIR /app

# Copy proto files
COPY internal/protobuf ./internal/protobuf

# Generate protobuf files
RUN mkdir -p internal/gen && \
    cd internal/protobuf && \
    for proto in *.proto; do \
        protoc \
            --go_out=../gen \
            --go_opt=paths=source_relative \
            --go-grpc_out=../gen \
            --go-grpc_opt=paths=source_relative \
            "$proto"; \
    done

# This is just a utility image, we'll copy files out using volume mount
CMD ["cp", "-r", "internal/gen", "/app/"]
